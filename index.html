<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وەرگێڕی گەردونی پرۆفیشناڵ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&family=Poppins:wght@400;600&display=swap');

        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            padding: 20px;
        }

        .translator-container {
            width: 100%;
            max-width: 900px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #6366f1;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .language-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--card-border);
        }

        .lang-select {
            font-weight: 500;
            font-size: 1.1rem;
            padding: 8px 16px;
            border-radius: 8px;
            color: var(--text-muted);
            transition: 0.3s;
        }

        .lang-select.active {
            color: #fff;
            background: rgba(99, 102, 241, 0.2);
        }

        .swap-btn {
            background: var(--primary-color);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            transition: 0.3s ease;
        }

        .swap-btn:hover {
            background: var(--primary-hover);
            transform: rotate(180deg);
        }

        .text-area-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 768px) {
            .text-area-container {
                grid-template-columns: 1fr;
            }
        }

        .input-box, .output-box {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 220px;
            position: relative;
        }

        .input-box:focus-within {
            border-color: var(--primary-color);
        }

        textarea {
            width: 100%;
            height: 140px;
            background: transparent;
            border: none;
            resize: none;
            outline: none;
            color: #fff;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        #outputText {
            width: 100%;
            height: 140px;
            font-size: 1.1rem;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .placeholder-text {
            color: var(--text-muted);
        }

        .box-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .control-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 5px 10px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .control-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .char-count {
            font-size: 0.85rem;
            color: var(--text-muted);
            direction: ltr; 
        }

        .translate-btn {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .translate-btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.4);
        }
        
        .translate-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="translator-container">
        <header>
            <h1><i class="fa-solid fa-language"></i> وەرگێڕی خێرا</h1>
            <p>وەرگێڕانی ڕاستەوخۆ بۆ هەموو ڕستە و وشەیەک</p>
        </header>

        <div class="language-row">
            <div class="lang-select active" id="srcLangText">کوردی (سۆرانی)</div>
            <button class="swap-btn" id="swapBtn" title="گۆڕینی زمانەکان">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
            <div class="lang-select" id="targetLangText">English</div>
        </div>

        <div class="text-area-container">
            <div class="input-box">
                <textarea id="inputText" placeholder="دەقەکەت لێرە بنووسە..."></textarea>
                <div class="box-controls">
                    <button class="control-btn" id="clearBtn" title="پاککردنەوە"><i class="fa-solid fa-trash"></i></button>
                    <span class="char-count" id="charCount">0 / 5000</span>
                </div>
            </div>

            <div class="output-box">
                <div id="outputText" class="placeholder-text">وەرگێڕان لێرە دەردەکەوێت...</div>
                <div class="box-controls">
                    <button class="control-btn" id="copyBtn" title="کۆپیکردن"><i class="fa-solid fa-copy"></i></button>
                </div>
            </div>
        </div>

        <button class="translate-btn" id="translateBtn">
            <span id="btnText">وەرگێڕان</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>
    </div>

    <script>
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const translateBtn = document.getElementById('translateBtn');
        const btnText = document.getElementById('btnText');
        const swapBtn = document.getElementById('swapBtn');
        const srcLangText = document.getElementById('srcLangText');
        const targetLangText = document.getElementById('targetLangText');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const charCount = document.getElementById('charCount');

        let sourceLang = "ckb"; // کۆدی زمانی کوردی سۆرانی
        let targetLang = "en";  // ئینگلیزی

        // گۆڕینی زمانەکان
        swapBtn.addEventListener('click', () => {
            if (sourceLang === "ckb") {
                sourceLang = "en";
                targetLang = "ckb";
                srcLangText.textContent = "English";
                targetLangText.textContent = "کوردی (سۆرانی)";
                inputText.placeholder = "Type text here...";
                inputText.style.direction = "ltr";
                outputText.style.direction = "rtl";
            } else {
                sourceLang = "ckb";
                targetLang = "en";
                srcLangText.textContent = "کوردی (سۆرانی)";
                targetLangText.textContent = "English";
                inputText.placeholder = "دەقەکەت لێرە بنووسە...";
                inputText.style.direction = "rtl";
                outputText.style.direction = "ltr";
            }
            clearFields();
        });

        // ئەژمارکردنی پیتەکان
        inputText.addEventListener('input', () => {
            const length = inputText.value.length;
            charCount.textContent = `${length} / 5000`;
        });

        clearBtn.addEventListener('click', clearFields);

        function clearFields() {
            inputText.value = "";
            outputText.textContent = sourceLang === "ckb" ? "وەرگێڕان لێرە دەردەکەوێت..." : "Translation will appear here...";
            outputText.classList.add('placeholder-text');
            charCount.textContent = "0 / 5000";
        }

        copyBtn.addEventListener('click', () => {
            if (!outputText.classList.contains('placeholder-text')) {
                navigator.clipboard.writeText(outputText.textContent);
                alert(sourceLang === "ckb" ? "کۆپی کرا!" : "Copied!");
            }
        });

        // کرداری وەرگێڕانی ڕاستەوخۆ لە ڕێگەی سێرڤەرەوە
        translateBtn.addEventListener('click', async () => {
            const text = inputText.value.trim();
            if (text === "") return;

            outputText.classList.remove('placeholder-text');
            btnText.textContent = sourceLang === "ckb" ? "چاوەڕوان بە..." : "Translating...";
            translateBtn.disabled = true;

            try {
                // بەکارهێنانی سێرڤەرێکی گشتی و بێبەرامبەر بۆ وەرگێڕانی دەقەکە
                const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await response.json();
                
                // کۆکردنەوەی دەرئەنجامی وەرگێڕانەکە
                let translatedText = "";
                data[0].forEach(item => {
                    if (item[0]) translatedText += item[0];
                });

                outputText.textContent = translatedText;
            } catch (error) {
                console.error(error);
                outputText.textContent = sourceLang === "ckb" ? "هەڵەیەک ڕوویدا! تکایە هێڵەکەت بپشکنە." : "An error occurred! Please check your connection.";
            } finally {
                btnText.textContent = sourceLang === "ckb" ? "وەرگێڕان" : "Translate";
                translateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
